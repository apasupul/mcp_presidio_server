[loggers]
keys=root,app

[handlers]
keys=console

[formatters]
keys=std

[logger_root]
level=INFO
handlers=console

[logger_app]
level=INFO
handlers=console
qualname=app
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=std
args=(sys.stdout,)

[formatter_std]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
